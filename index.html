<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوت سحب الداتا</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #0d1117;
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            direction: rtl;
            text-align: center;
        }
        .header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f0c040;
        }
        .steps {
            background: #161b22;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 2;
            text-align: right;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .box {
            border-radius: 14px;
            padding: 24px 8px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
            transition: 0.2s;
            cursor: pointer;
            color: white;
            border: none;
            width: 100%;
            min-height: 90px;
        }
        .box:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }
        /* الألوان المطابقة للصورة */
        .red    { background: #e74c3c; }  /* فودافون */
        .orange { background: #e67e22; }  /* اتصالات */
        .green  { background: #27ae60; }  /* تموين */
        .blue   { background: #2980b9; }  /* واي */
        .purple { background: #8e44ad; }  /* النترا */
        .pink   { background: #e84393; }  /* اورنج */
        .teal   { background: #16a085; }  /* Services Axis Pay */
        .gold   { background: #f39c12; }  /* الرقم القومي */
        .dark   { background: #2c3e50; }  /* الإحالات والدعم */
        .full-width {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="header">🪄 بوت سحب الداتا</div>

    <div class="steps">
        📋 خطوات السحب:<br>
        ① أرسل رقم المحفظة<br>
        ② أرسل اسم المحفظة<br>
        ③ أرسل الرقم المرغوب السحب عليه<br>
        ⏳ ثم تحلّى بالصبر وصلي على خير البرية
    </div>

    <div class="grid">
        <button class="box red" onclick="choose('قسم_فودافون')">📞 قسم فودافون</button>
        <button class="box orange" onclick="choose('قسم_اتصالات')">📶 قسم اتصالات</button>
        <button class="box green" onclick="choose('قسم_تموين')">🍞 قسم تموين</button>
        <button class="box blue" onclick="choose('قسم_واي')">📡 قسم واي</button>
        <button class="box purple" onclick="choose('قسم_النترا')">💻 قسم النترا</button>
        <button class="box pink" onclick="choose('قسم_اورنج')">📱 قسم اورنج</button>
        <button class="box teal full-width" onclick="choose('Services_Axis_Pay')">💳 Services Axis Pay</button>
        <button class="box gold full-width" onclick="choose('رقم_قومي')">🆔 موقع الرقم القومي</button>
        <button class="box dark" onclick="choose('إحالات')">👥 الإحالات</button>
        <button class="box dark" onclick="choose('دعم_فني')">🛠️ الدعم الفني</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // يأخذ كامل الشاشة

        function choose(data) {
            tg.sendData(data);   // يبعت للبوت الكود اللي اخترته
            tg.close();          // يقفل التطبيق تلقائياً
        }
    </script>
</body>
</html>
